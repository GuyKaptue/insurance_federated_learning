  - name: is_high_risk
    type: target
  - name: customer_segment
    type: target
  - name: country
    type: country
  - name: country.income_mean
    type: country_parameter
  - name: country.income_std
    type: country_parameter
  - name: country.savings_rate
    type: country_parameter
  - name: country.savings_mean
