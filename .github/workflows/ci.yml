name: CI

on:
  push:
    branches: [main, develop, feat/task0-baseline-federation]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,causal]"
      - name: Generate canonical dataset (untracked in git)
        run: |
          insurance-fl-generate --samples 5000 --seed 42 --version v2 \
            --output data/processed/european_insurance_federated
      - name: CI
        run: make ci
      - name: flwr-guard
        run: make flwr-guard
