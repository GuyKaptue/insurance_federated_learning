[[ignore]]
id = "PYSEC-2026-4321"
package = "uv"
reason = "uv 0.11.33 is a hard runtime dependency of flwr==1.31.0 (declared uv>=0.11.15,<0.12.0); fix 0.13.4 outside range."
exploitability_here = "uv is used by flwr run to install/run the app in simulation mode. Compromised emSign ECC root in uv's vendored webpki CA bundle enables MITM during TLS-verified app installation. Reachable via make flwr-guard / artifacts job. Cannot remediate without flwr upgrade beyond 1.31."
added = "2026-11-20"
expires = "2027-01-19"
