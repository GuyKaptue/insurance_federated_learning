name: CI

on:
  push:
    branches: [main, develop, feat/task0-baseline-federation]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/ci-linux-py311.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-linux-py311.txt -e ".[dev,causal,privacy,notebooks]"
      - name: pip check
        run: python -m pip check
      - name: Ruff
        run: python -m ruff check src/insurance_fl tests
      - name: Black
        run: python -m black --check src/insurance_fl tests
      - name: Isort
        run: python -m isort --check-only src/insurance_fl tests
      - name: Mypy
        run: python -m mypy src/insurance_fl

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/ci-linux-py311.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-linux-py311.txt -e ".[dev,causal,privacy,notebooks]"
      - name: pip check
        run: python -m pip check
      - name: Unit tests (not slow) with coverage
        run: |
          pytest -v --tb=short --cov=insurance_fl --cov-fail-under=70 -m "not slow" tests/unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/ci-linux-py311.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-linux-py311.txt -e ".[dev,causal,privacy,notebooks]"
      - name: pip check
        run: python -m pip check
      - name: Generate canonical dataset (untracked in git)
        run: |
          insurance-fl-generate --samples 5000 --seed 42 --version v2 \
            --output data/processed/european_insurance_federated
      - name: Integration tests
        run: pytest -v --tb=short tests/integration

  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/ci-linux-py311.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-linux-py311.txt -e ".[dev,causal,privacy,notebooks]"
      - name: pip check
        run: python -m pip check
      - name: Generate canonical dataset (untracked in git)
        run: |
          insurance-fl-generate --samples 5000 --seed 42 --version v2 \
            --output data/processed/european_insurance_federated
      - name: Data check
        run: make data-check
      - name: Artifact/provenance tests
        run: pytest -q --tb=short tests/unit/test_artifact_provenance.py
      - name: flwr-guard
        run: make flwr-guard

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/ci-linux-py311.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-linux-py311.txt -e ".[dev,causal,privacy,notebooks]"
      - name: pip check
        run: python -m pip check
      - name: Register Jupyter kernel
        run: python -m ipykernel install --user --name insurance-fl --display-name "insurance-fl (CI)"
      - name: Generate canonical dataset (untracked in git)
        run: |
          insurance-fl-generate --samples 5000 --seed 42 --version v2 \
            --output data/processed/european_insurance_federated
      - name: Validate notebooks (NB_MODE=light)
        env:
          NB_MODE: light
          CI: "true"
        run: python scripts/validate_notebooks.py

  privacy-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/ci-linux-py311.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-linux-py311.txt -e ".[dev,causal,privacy,notebooks]"
      - name: pip check
        run: python -m pip check
      - name: Privacy extra installed check
        run: python -c "import dp_accounting; print('dp_accounting ok')"
      - name: Privacy unit/integration checks
        run: |
          pytest -q --tb=short tests/unit/fl/test_privacy.py tests/unit/test_artifact_provenance.py
          pytest -q --tb=short tests/integration/test_rdp_accounting.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/ci-linux-py311.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-linux-py311.txt -e ".[dev,causal,privacy,notebooks]"
          python -m pip install pip-audit
      - name: pip check
        run: python -m pip check
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: pip-audit
        run: |
          ignore_args=""
          if [ -f security/pip-audit-ignore.txt ]; then
            ignore_args=$(awk 'NF && $1 !~ /^#/{printf "--ignore-vuln %s ", $1}' security/pip-audit-ignore.txt)
          fi
          pip-audit -r constraints/ci-linux-py311.txt --no-deps --disable-pip --strict $ignore_args

  ci-gate:
    runs-on: ubuntu-latest
    needs: [quality, unit, integration, artifacts, notebooks, privacy-invariants, security]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        run: |
          echo "quality=${{ needs.quality.result }}"
          echo "unit=${{ needs.unit.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "artifacts=${{ needs.artifacts.result }}"
          echo "notebooks=${{ needs.notebooks.result }}"
          echo "privacy-invariants=${{ needs.privacy-invariants.result }}"
          echo "security=${{ needs.security.result }}"
          test "${{ needs.quality.result }}" = "success" && \
          test "${{ needs.unit.result }}" = "success" && \
          test "${{ needs.integration.result }}" = "success" && \
          test "${{ needs.artifacts.result }}" = "success" && \
          test "${{ needs.notebooks.result }}" = "success" && \
          test "${{ needs.privacy-invariants.result }}" = "success" && \
          test "${{ needs.security.result }}" = "success"
