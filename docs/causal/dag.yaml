# Causal DAG for the Insurance Federated Learning Platform
# Nodes: 21 numeric features + 5 targets + country parameters.
# Edges: kind ∈ {feature, country, federated}.
# country = driven by a country parameter (shifts features/targets across clients).
# federated = estimable within a client (feature → feature, feature → target).
# Adjustment sets block every backdoor path from treatment to outcome.
# Default estimand: has_claims → claim_risk_score
#   Z = [age, annual_income, savings_balance, credit_score, debt_to_income_ratio]

