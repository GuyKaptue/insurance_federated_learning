# Justified, time-boxed pip-audit ignores for vulnerabilities that cannot be
# remediated within current dependency bounds (see docs/DECISIONS.md).
# One entry per advisory ID (no wildcards). Validated by scripts/ci/check_audit_ignores.py.
# Added 2026-11-20. Expiry window <= 60 days.

[[ignore]]
id = "GHSA-537c-gmf6-5ccf"
package = "cryptography"
reason = "cryptography 46.0.7 pinned by flwr==1.31.0 (>=46.0.7,<47.0.0); fix 48.0.1 outside range."
exploitability_here = "Statically linked OpenSSL in wheels < 48.0.1 vulnerable (CWE-125/CWE-1395). cryptography used by flwr (mTLS/TLS SuperLink/SuperNode) and google-auth. Reachable whenever flwr establishes TLS connections; remediation deferred to flwr upgrade."
added = "2026-11-20"
expires = "2027-01-19"

[[ignore]]
id = "PYSEC-2026-3552"
package = "cryptography"
reason = "cryptography 46.0.7 pinned by flwr==1.31.0 (<47.0.0); fix 50.0.0 outside range."
exploitability_here = "PKCS#7 EnvelopedData decryption Bleichenbacher oracle (GHSA-g6cj-pr64-35w5/CVE-2026-69247). Reachable only if repo decrypts attacker-supplied EnvelopedData and reflects outcomes — not present in src (no pkcs7_decrypt). Low reachability; advisory applies because cryptography is installed."
added = "2026-11-20"
expires = "2027-01-19"

[[ignore]]
id = "PYSEC-2026-3553"
package = "cryptography"
reason = "cryptography 46.0.7 pinned by flwr==1.31.0 (<47.0.0); fix 49.0.0 outside range."
exploitability_here = "Duplicate self-signed intermediates cause exponential cert path-building DoS (GHSA-jwv3-5hgf-82ww/CVE-2026-69249). Reachable if flwr mTLS verification processes attacker-controlled certificate chains; cryptography used by flwr and google-auth. Remediation deferred to flwr upgrade."
added = "2026-11-20"
expires = "2027-01-19"

[[ignore]]
id = "PYSEC-2026-3554"
package = "cryptography"
reason = "cryptography 46.0.7 pinned by flwr==1.31.0 (<47.0.0); fix 49.0.0 outside range."
exploitability_here = "Verifier accepts wildcard DNS names escaping permittedSubtrees (GHSA-m2h6-j472-rp4c/CVE-2026-69248). Reachable if flwr mTLS verification processes constrained CA chains with wildcard leaf SANs; cryptography used by flwr and google-auth. Remediation deferred to flwr upgrade."
added = "2026-11-20"
expires = "2027-01-19"

[[ignore]]
id = "PYSEC-2026-113"
package = "pyarrow"
reason = "pyarrow 17.0.0 accepted (logical data identity verified vs 14.0.2) but itself carries PYSEC-2026-113 fix 23.0.1 — another major jump requiring a separate trial."
exploitability_here = "pyarrow used for parquet read/write in dataset generation and check_dataset_signal. Advisory reachable via parquet I/O. Fix 23.0.1 is a major jump outside current bound; defer to a dedicated trial."
added = "2026-11-20"
expires = "2027-01-19"

[[ignore]]
id = "PYSEC-2024-259"
package = "torch"
reason = "torch 2.4.1; trial bump to 2.13.0 segfaulted (RC=139) on macOS arm64 and full gate comparison incomplete due to disk. Rejected for now."
exploitability_here = "torch used for multi-task NN training/inference. torch.load uses weights_only=True (src/insurance_fl/models/multi_task_nn.py:369); torch.save writes own state_dict only (line 345). No torch.jit/torch.distributed/torch.save-of-untrusted usage. Deserialization advisories not reachable; other torch advisories (CUDA/jit/distributed) not exercised by repo. Trial inconclusive on macOS arm64; unverified on Linux x86_64."
added = "2026-11-20"
expires = "2027-01-19"

